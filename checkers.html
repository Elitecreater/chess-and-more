<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Checkers - High-Detail Stylized Pieces</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0e15;
      color: #fff;
    }

    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(20, 24, 38, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #controls {
      display: flex;
      gap: 8px;
    }

    input, button {
      padding: 8px 14px;
      font-size: 0.9rem;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    input { 
      background: rgba(255, 255, 255, 0.08); 
      color: #fff; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
    }
    
    input::placeholder { color: #aaa; }

    button { 
      background: #ff3b30; 
      color: white; 
      cursor: pointer; 
      font-weight: 600;
      transition: background 0.2s ease;
    }
    button:hover { background: #d72b21; }

    #status { 
      font-size: 0.9rem; 
      color: #ddd; 
      font-weight: 500;
    }

    /* Foldable Chat Styling */
    #chat-box {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 300px;
      background: rgba(20, 24, 38, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    #chat-header {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      font-weight: 600;
    }

    #chat-toggle-btn {
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 1.1rem;
      padding: 0 4px;
      cursor: pointer;
    }

    #chat-content {
      display: flex;
      flex-direction: column;
      height: 260px;
    }

    #chat-box.collapsed #chat-content {
      display: none;
    }

    #chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message { word-wrap: break-word; line-height: 1.3; }
    .msg-you { color: #00d2ff; }
    .msg-them { color: #ff5252; }

    #chat-input-container {
      display: flex;
      padding: 8px;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #chat-input { flex: 1; }
  </style>
</head>
<body>

  <div id="ui-container">
    <div id="controls">
      <input type="text" id="room-code-input" placeholder="Room Code">
      <button onclick="hostGame()">Host</button>
      <button onclick="joinGame()">Join</button>
    </div>
    <div id="status">Enter a room code to host or join.</div>
  </div>

  <div id="chat-box">
    <div id="chat-header" onclick="toggleChat()">
      <span>Game Chat</span>
      <button id="chat-toggle-btn">−</button>
    </div>
    <div id="chat-content">
      <div id="chat-messages"></div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 8;
    let scene, camera, renderer, raycaster, mouse;
    let boardState = [];
    let board3D = [];
    let turn = 'R';
    let playerColor = null;
    let selectedPiece = null;
    let selectionMarker = null;
    let peer = null, conn = null;

    init3D();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c0d14);

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 11, 11);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Stylized Vibrant Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(6, 14, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0001;
      scene.add(dirLight);

      const rimLight = new THREE.DirectionalLight(0x00d2ff, 0.6);
      rimLight.position.set(-8, 10, -8);
      scene.add(rimLight);

      // Stylized Selection Marker (Hovering Hexagon / Ring)
      const ringGeo = new THREE.RingGeometry(0.40, 0.46, 6); // Hexagonal ring
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
      selectionMarker = new THREE.Mesh(ringGeo, ringMat);
      selectionMarker.rotation.x = Math.PI / 2;
      selectionMarker.position.y = 0.35;
      selectionMarker.visible = false;
      scene.add(selectionMarker);

      createBoard3D();
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onPointerDown);
    }

    function createBoard3D() {
      // Outer Board Base
      const frameGeo = new THREE.BoxGeometry(9, 0.4, 9);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x181a26, roughness: 0.2 });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = -0.2;
      frame.receiveShadow = true;
      scene.add(frame);

      // Board Grid Squares
      const squareGeo = new THREE.BoxGeometry(1, 0.2, 1);
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x232738, roughness: 0.3 });
      const lightMat = new THREE.MeshStandardMaterial({ color: 0x3d4461, roughness: 0.3 });

      for (let r = 0; r < BOARD_SIZE; r++) {
        board3D[r] = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          const isDark = (r + c) % 2 !== 0;
          const square = new THREE.Mesh(squareGeo, isDark ? darkMat : lightMat);
          square.position.set(c - 3.5, 0, r - 3.5);
          square.receiveShadow = true;
          square.userData = { row: r, col: c, isSquare: true };
          scene.add(square);
          board3D[r][c] = square;
        }
      }
    }

    // High-Detail Stylized Checker Piece (Not realistic wood/plastic; high-polygon geometrical design)
    function createDetailedPieceMesh(colorStr) {
      const group = new THREE.Group();
      const isRed = colorStr === 'R';

      // Vibrant, saturated materials for stylized game-art look
      const bodyMat = new THREE.MeshStandardMaterial({
        color: isRed ? 0xff2a4b : 0x1a202c,
        roughness: 0.15,
        metalness: 0.2
      });

      const trimMat = new THREE.MeshStandardMaterial({
        color: isRed ? 0xff7388 : 0x4a5568,
        roughness: 0.1,
        metalness: 0.5
      });

      const gemMat = new THREE.MeshStandardMaterial({
        color: isRed ? 0xff8899 : 0x00d2ff,
        roughness: 0.05,
        metalness: 0.8,
        emissive: isRed ? 0x440011 : 0x003344
      });

      // 1. Base Stepped Pedestal
      const baseGeo = new THREE.CylinderGeometry(0.42, 0.44, 0.06, 32);
      const baseMesh = new THREE.Mesh(baseGeo, bodyMat);
      baseMesh.position.y = 0.13;
      baseMesh.castShadow = true;
      baseMesh.receiveShadow = true;
      group.add(baseMesh);

      // 2. Beveled Lower Ring
      const ring1Geo = new THREE.CylinderGeometry(0.39, 0.42, 0.05, 32);
      const ring1Mesh = new THREE.Mesh(ring1Geo, trimMat);
      ring1Mesh.position.y = 0.185;
      ring1Mesh.castShadow = true;
      group.add(ring1Mesh);

      // 3. Middle Tier with Vertical Teeth / Cog Details
      const midGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.06, 32);
      const midMesh = new THREE.Mesh(midGeo, bodyMat);
      midMesh.position.y = 0.24;
      midMesh.castShadow = true;
      group.add(midMesh);

      const toothCount = 12;
      for (let i = 0; i < toothCount; i++) {
        const angle = (i / toothCount) * Math.PI * 2;
        const toothGeo = new THREE.BoxGeometry(0.04, 0.06, 0.04);
        const tooth = new THREE.Mesh(toothGeo, trimMat);
        tooth.position.set(Math.cos(angle) * 0.37, 0.24, Math.sin(angle) * 0.37);
        tooth.rotation.y = -angle;
        tooth.castShadow = true;
        group.add(tooth);
      }

      // 4. Upper Chamfered Ring
      const ring2Geo = new THREE.CylinderGeometry(0.34, 0.38, 0.04, 32);
      const ring2Mesh = new THREE.Mesh(ring2Geo, trimMat);
      ring2Mesh.position.y = 0.29;
      ring2Mesh.castShadow = true;
      group.add(ring2Mesh);

      // 5. Inset Center Crest with Faceted Gem / Star Node
      const centerGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.02, 32);
      const centerMesh = new THREE.Mesh(centerGeo, bodyMat);
      centerMesh.position.y = 0.31;
      centerMesh.castShadow = true;
      group.add(centerMesh);

      const gemGeo = new THREE.OctahedronGeometry(0.08, 0);
      const gemMesh = new THREE.Mesh(gemGeo, gemMat);
      gemMesh.position.y = 0.33;
      gemMesh.scale.set(1, 0.4, 1);
      gemMesh.castShadow = true;
      group.add(gemMesh);

      return group;
    }

    // Stylized Modular Crown Architecture for Kings
    function createCrownMesh() {
      const crownGroup = new THREE.Group();

      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.9,
        roughness: 0.15
      });

      const jewelMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        metalness: 0.5,
        roughness: 0.1,
        emissive: 0x005577
      });

      // Metallic Base Ring
      const ringGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.04, 16);
      const ringMesh = new THREE.Mesh(ringGeo, goldMat);
      ringMesh.position.y = 0.33;
      ringMesh.castShadow = true;
      crownGroup.add(ringMesh);

      // 6 Angular Spires
      const pointsCount = 6;
      for (let i = 0; i < pointsCount; i++) {
        const angle = (i / pointsCount) * Math.PI * 2;
        
        // Spire Pillar
        const spireGeo = new THREE.ConeGeometry(0.04, 0.14, 4);
        const spire = new THREE.Mesh(spireGeo, goldMat);
        spire.position.set(Math.cos(angle) * 0.2, 0.40, Math.sin(angle) * 0.2);
        spire.rotation.y = angle;
        spire.castShadow = true;
        crownGroup.add(spire);

        // Tiny Jewels set on spires
        const jewelGeo = new THREE.SphereGeometry(0.025, 8, 8);
        const jewel = new THREE.Mesh(jewelGeo, jewelMat);
        jewel.position.set(Math.cos(angle) * 0.2, 0.47, Math.sin(angle) * 0.2);
        crownGroup.add(jewel);
      }

      // Central Floating Power Crystal
      const crystalGeo = new THREE.OctahedronGeometry(0.09, 0);
      const crystal = new THREE.Mesh(crystalGeo, jewelMat);
      crystal.position.y = 0.42;
      crystal.castShadow = true;
      crownGroup.add(crystal);

      return crownGroup;
    }

    function render3DPieces() {
      scene.children.filter(c => c.userData.isPiece).forEach(p => scene.remove(p));

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const val = boardState[r][c];
          if (val) {
            const colorStr = val.charAt(0);
            const pieceGroup = createDetailedPieceMesh(colorStr);
            pieceGroup.position.set(c - 3.5, 0, r - 3.5);
            pieceGroup.userData = { row: r, col: c, isPiece: true, val: val };

            if (val.includes('K')) {
              const crown = createCrownMesh();
              pieceGroup.add(crown);
            }

            scene.add(pieceGroup);
          }
        }
      }

      // Update Selection Marker Position
      if (selectedPiece) {
        selectionMarker.position.set(selectedPiece.col - 3.5, 0.36, selectedPiece.row - 3.5);
        selectionMarker.visible = true;
      } else {
        selectionMarker.visible = false;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (selectionMarker && selectionMarker.visible) {
        selectionMarker.rotation.z += 0.02; // Rotate the hexagonal ring marker
      }
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ------------------- Network & Controls -------------------
    function hostGame() {
      const code = document.getElementById('room-code-input').value.trim().toLowerCase();
      if (!code) return;

      peer = new Peer(code);
      peer.on('open', id => {
        playerColor = 'R';
        setCameraPerspective('R');
        document.getElementById('status').textContent = `Hosted "${id}". Waiting for player...`;
      });
      peer.on('connection', c => {
        conn = c;
        setupNetwork();
        initBoard();
        document.getElementById('status').textContent = "Opponent joined! Your turn (Red).";
      });
    }

    function joinGame() {
      const code = document.getElementById('room-code-input').value.trim().toLowerCase();
      if (!code) return;

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(code);
        playerColor = 'B';
        setCameraPerspective('B');
        setupNetwork();
      });
    }

    function setCameraPerspective(color) {
      if (color === 'B') {
        camera.position.set(0, 11, -11);
        camera.lookAt(0, 0, 0);
      } else {
        camera.position.set(0, 11, 11);
        camera.lookAt(0, 0, 0);
      }
    }

    function setupNetwork() {
      conn.on('open', () => {
        if (playerColor === 'B') {
          document.getElementById('status').textContent = "Connected! Waiting for Red...";
          initBoard();
        }
      });

      conn.on('data', data => {
        if (data.type === 'MOVE') {
          makeMove(data.fromR, data.fromC, data.toR, data.toC);
          turn = data.nextTurn;
          updateTurnStatus();
          render3DPieces();
        } else if (data.type === 'CHAT') {
          appendChatMessage('Opponent', data.msg, 'msg-them');
        }
      });
    }

    // ------------------- Game Logic -------------------
    function initBoard() {
      boardState = [
        [null, 'B', null, 'B', null, 'B', null, 'B'],
        ['B', null, 'B', null, 'B', null, 'B', null],
        [null, 'B', null, 'B', null, 'B', null, 'B'],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        ['R', null, 'R', null, 'R', null, 'R', null],
        [null, 'R', null, 'R', null, 'R', null, 'R'],
        ['R', null, 'R', null, 'R', null, 'R', null]
      ];
      turn = 'R';
      selectedPiece = null;
      render3DPieces();
    }

    function onPointerDown(event) {
      if (event.clientX < 220 && event.clientY < 120) return;
      if (event.clientX > window.innerWidth - 320 && event.clientY > window.innerHeight - 300) return;

      if (!conn || turn !== playerColor) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) obj = obj.parent;

        const data = obj.userData;
        if (!data) return;

        if (data.isPiece && boardState[data.row][data.col]?.startsWith(turn)) {
          selectedPiece = { row: data.row, col: data.col };
          render3DPieces();
        } else if (selectedPiece && (data.isSquare || data.isPiece)) {
          const toR = data.row, toC = data.col;
          if (isValidMove(selectedPiece.row, selectedPiece.col, toR, toC)) {
            const fromR = selectedPiece.row, fromC = selectedPiece.col;
            makeMove(fromR, fromC, toR, toC);
            const nextTurn = turn === 'R' ? 'B' : 'R';

            conn.send({ type: 'MOVE', fromR, fromC, toR, toC, nextTurn });
            turn = nextTurn;
            selectedPiece = null;
            updateTurnStatus();
            render3DPieces();
          }
        }
      }
    }

    function isValidMove(fromR, fromC, toR, toC) {
      if (boardState[toR][toC] !== null) return false;
      const piece = boardState[fromR][fromC];
      const isKing = piece.includes('K');
      const rowDiff = toR - fromR;
      const colDiff = Math.abs(toC - fromC);
      const dir = piece.startsWith('R') ? -1 : 1;

      if (colDiff === 1 && (rowDiff === dir || (isKing && Math.abs(rowDiff) === 1))) return true;
      if (colDiff === 2 && (rowDiff === 2 * dir || (isKing && Math.abs(rowDiff) === 2))) {
        const midR = fromR + rowDiff / 2;
        const midC = fromC + (toC - fromC) / 2;
        return boardState[midR][midC] && !boardState[midR][midC].startsWith(turn);
      }
      return false;
    }

    function makeMove(fromR, fromC, toR, toC) {
      let piece = boardState[fromR][fromC];
      boardState[fromR][fromC] = null;

      if (Math.abs(toR - fromR) === 2) {
        boardState[fromR + (toR - fromR) / 2][fromC + (toC - fromC) / 2] = null;
      }

      if (piece === 'R' && toR === 0) piece = 'RK';
      if (piece === 'B' && toR === 7) piece = 'BK';

      boardState[toR][toC] = piece;
    }

    function updateTurnStatus() {
      const isMyTurn = turn === playerColor;
      document.getElementById('status').textContent = isMyTurn ? `Your turn (${turn})` : `Opponent's turn (${turn})`;
    }

    // ------------------- Chat Logic -------------------
    function toggleChat() {
      const chatBox = document.getElementById('chat-box');
      const toggleBtn = document.getElementById('chat-toggle-btn');
      
      chatBox.classList.toggle('collapsed');
      toggleBtn.textContent = chatBox.classList.contains('collapsed') ? '+' : '−';
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg || !conn) return;

      conn.send({ type: 'CHAT', msg });
      appendChatMessage('You', msg, 'msg-you');
      input.value = '';
    }

    function appendChatMessage(sender, msg, className) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `message ${className}`;
      div.textContent = `${sender}: ${msg}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
