<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Realistic 3D P2P Chess (Three.js)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #475569;
      color: #f8fafc;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      background: #334155;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid #475569;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .room-setup {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
      justify-content: center;
    }
    .setup-group {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 280px;
    }
    input {
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      border-radius: 30px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #d97706;
    }
    .status-box {
      width: 100%;
      background: #1e293b;
      border-left: 5px solid #d97706;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      color: #f8fafc;
    }

    .game-layout {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }
    
    #canvas-container {
      width: 450px;
      height: 450px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .chat-container {
      width: 300px;
      height: 450px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #0f172a;
      padding: 10px 14px;
      font-weight: 600;
      border-bottom: 1px solid #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f8fafc;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-message {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      word-wrap: break-word;
      line-height: 1.3;
    }

    .chat-message.self {
      align-self: flex-end;
      background: #d97706;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-message.opponent {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }

    .chat-message .time {
      display: block;
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .chat-input-area {
      display: flex;
      padding: 8px;
      gap: 6px;
      background: #0f172a;
      border-top: 1px solid #475569;
    }

    .chat-input-area input {
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
    }

    .chat-input-area button {
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    button {
      background: #d97706;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    button:hover { background: #b45309; }
    button:active { transform: scale(0.98); }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    button.ai-btn { background: #059669; }
    button.ai-btn:hover { background: #047857; }
  </style>
</head>
<body>

<div class="container">
  <div class="room-setup">
    <div class="setup-group">
      <button class="ai-btn" onclick="startAIMode()">Play vs AI</button>
    </div>
    <div class="setup-group">
      <input type="text" id="customHostId" placeholder="Host Code (Optional)">
      <button onclick="startHost()">Host P2P</button>
    </div>
    <div class="setup-group">
      <input type="text" id="joinId" placeholder="Enter Host Code">
      <button class="secondary" onclick="joinGame()">Join Host</button>
    </div>
  </div>

  <div class="status-box" id="status">Select Play vs AI, or enter a Host Code for multiplayer P2P.</div>

  <div class="game-layout">
    <div id="canvas-container"></div>

    <div class="chat-container">
      <div class="chat-header">
        <span id="chatTitle">In-Game Chat</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendChatMessage()">
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  // --- Game State & Networking ---
  let peer = null;
  let conn = null;
  let isAIMode = false;
  let aiColor = 'black';
  let myColor = 'white';
  let turn = 'white';
  let gameOver = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'move') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'capture') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    } else if (type === 'check') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(300, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'win') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554.37, now + 0.15);
      osc.frequency.setValueAtTime(659.25, now + 0.3);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    } else if (type === 'chat') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    }
  }

  const initialBoard = [
    ['r','n','b','q','k','b','n','r'],
    ['p','p','p','p','p','p','p','p'],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['p','p','p','p','p','p','p','p'],
    ['r','n','b','q','k','b','n','r']
  ];

  const initialPieceColors = [
    ['black','black','black','black','black','black','black','black'],
    ['black','black','black','black','black','black','black','black'],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['white','white','white','white','white','white','white','white'],
    ['white','white','white','white','white','white','white','white']
  ];

  let boardState = JSON.parse(JSON.stringify(initialBoard));
  let colorState = JSON.parse(JSON.stringify(initialPieceColors));
  let selectedSquare = null;

  function startAIMode() {
    if (peer) peer.destroy();
    conn = null;
    isAIMode = true;
    myColor = 'white';
    aiColor = 'black';
    document.getElementById('chatTitle').innerText = 'Chat (AI Opponent)';
    resetGameData();
    updateCameraAngle();
    render3D();
    updateStatus("VS AI Mode initialized.");
    displayChatMessage("Good luck! I'm ready when you are.", "opponent");
  }

  function startHost() {
    isAIMode = false;
    document.getElementById('chatTitle').innerText = 'In-Game Chat';
    const customId = document.getElementById('customHostId').value.trim();
    if (peer) peer.destroy();

    peer = customId ? new Peer(customId) : new Peer();

    document.getElementById('status').innerText = "Registering host code with server...";

    peer.on('open', (id) => {
      document.getElementById('status').innerText = `Host Code: ${id} (Waiting for Player 2...)`;
    });

    peer.on('connection', (c) => {
      conn = c;
      const hostIsWhite = Math.random() < 0.5;
      myColor = hostIsWhite ? 'white' : 'black';
      const joiningPlayerColor = hostIsWhite ? 'black' : 'white';

      setupConnection();

      conn.on('open', () => {
        conn.send({ type: 'init_role', assignedColor: joiningPlayerColor });
        resetGameData();
        updateCameraAngle();
        render3D();
        updateStatus();
      });
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        document.getElementById('status').innerText = "Error: Host Code taken. Try another!";
      } else {
        document.getElementById('status').innerText = `Error: ${err.message}`;
      }
    });
  }

  function joinGame() {
    isAIMode = false;
    document.getElementById('chatTitle').innerText = 'In-Game Chat';
    const hostId = document.getElementById('joinId').value.trim();
    if (!hostId) return alert("Enter a host code!");
    if (peer) peer.destroy();

    peer = new Peer();

    document.getElementById('status').innerText = "Connecting to Host...";

    peer.on('open', () => {
      conn = peer.connect(hostId);
      setupConnection();
    });

    peer.on('error', (err) => {
      document.getElementById('status').innerText = `Connection Error: ${err.message}`;
    });
  }

  function setupConnection() {
    conn.on('data', (data) => {
      if (data.type === 'init_role') {
        myColor = data.assignedColor;
        resetGameData();
        updateCameraAngle();
        render3D();
        updateStatus();
      } else if (data.type === 'move') {
        boardState = data.board;
        colorState = data.colors;
        turn = data.turn;

        if (data.isCheckmate) {
          handleGameOver(data.winner, "CHECKMATE! ");
        } else if (data.isCheck) {
          playSound('check');
          render3D();
          updateStatus("CHECK!");
        } else {
          playSound(data.isCapture ? 'capture' : 'move');
          render3D();
          updateStatus();
        }
      } else if (data.type === 'chat') {
        displayChatMessage(data.message, 'opponent');
        playSound('chat');
      }
    });

    conn.on('close', () => {
      if (!gameOver) {
        handleGameOver(myColor, "Opponent disconnected! ");
      }
    });
  }

  function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    displayChatMessage(msg, 'self');
    input.value = '';

    if (isAIMode) {
      playSound('chat');
      setTimeout(() => {
        const aiResponses = [
          "Interesting move strategy!",
          "I'm keeping my eyes on your queen.",
          "Nice choice, let's see how this plays out.",
          "Checkmate won't come that easy!",
          "Good game so far!"
        ];
        const resp = aiResponses[Math.floor(Math.random() * aiResponses.length)];
        displayChatMessage(resp, 'opponent');
        playSound('chat');
      }, 800);
    } else if (conn && conn.open) {
      conn.send({ type: 'chat', message: msg });
    } else {
      alert("You need to be connected to another player to chat.");
    }
  }

  function displayChatMessage(msg, sender) {
    const chatContainer = document.getElementById('chatMessages');
    const msgEl = document.createElement('div');
    msgEl.className = `chat-message ${sender}`;
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    msgEl.innerHTML = `${escapeHTML(msg)}<span class="time">${timeStr}</span>`;
    chatContainer.appendChild(msgEl);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHTML(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function resetGameData() {
    boardState = JSON.parse(JSON.stringify(initialBoard));
    colorState = JSON.parse(JSON.stringify(initialPieceColors));
    selectedSquare = null;
    turn = 'white';
    gameOver = false;
  }

  function resetGame() {
    resetGameData();
    render3D();
    if (isAIMode) {
      updateStatus("New AI Game started.");
    } else if (conn && conn.open) {
      updateStatus();
    } else {
      document.getElementById('status').innerText = peer?.id ? `Host Code: ${peer.id} (Waiting for Player 2...)` : "Select Play vs AI or Host/Join a game.";
    }
  }

  function handleGameOver(winner, prefix = "") {
    gameOver = true;
    selectedSquare = null;
    playSound('win');
    render3D();
    document.getElementById('status').innerText = `${prefix}${winner.toUpperCase()} WINS! Resetting game in 5 seconds...`;
    setTimeout(() => { resetGame(); }, 5000);
  }

  function updateStatus(extraText = "") {
    if (gameOver) return;
    const statusEl = document.getElementById('status');
    const isMyTurn = myColor === turn;
    let text = `You are ${myColor.toUpperCase()}. ` + (isMyTurn ? "Your turn!" : "Waiting for opponent...");
    if (extraText) text = `${extraText} ${text}`;
    statusEl.innerText = text;
  }

  // --- Move Validation Logic ---
  function isClearPath(b, r1, c1, r2, c2) {
    let dr = Math.sign(r2 - r1), dc = Math.sign(c2 - c1);
    let currR = r1 + dr, currC = c1 + dc;
    while (currR !== r2 || currC !== c2) {
      if (b[currR][currC] !== '') return false;
      currR += dr; currC += dc;
    }
    return true;
  }

  function isValidBasicMove(b, cSt, fromR, fromC, toR, toC) {
    const piece = b[fromR][fromC];
    const sourceColor = cSt[fromR][fromC];
    const targetColor = cSt[toR][toC];

    if (sourceColor === targetColor) return false;

    const dr = toR - fromR, dc = toC - fromC;
    const absDr = Math.abs(dr), absDc = Math.abs(dc);

    switch (piece) {
      case 'p':
        if (sourceColor === 'white') {
          if (dc === 0 && dr === -1 && targetColor === '') return true;
          if (dc === 0 && dr === -2 && fromR === 6 && targetColor === '' && b[5][fromC] === '') return true;
          if (absDc === 1 && dr === -1 && targetColor === 'black') return true;
        } else {
          if (dc === 0 && dr === 1 && targetColor === '') return true;
          if (dc === 0 && dr === 2 && fromR === 1 && targetColor === '' && b[2][fromC] === '') return true;
          if (absDc === 1 && dr === 1 && targetColor === 'white') return true;
        }
        return false;
      case 'r': return (dr === 0 || dc === 0) && isClearPath(b, fromR, fromC, toR, toC);
      case 'n': return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
      case 'b': return (absDr === absDc) && isClearPath(b, fromR, fromC, toR, toC);
      case 'q': return (dr === 0 || dc === 0 || absDr === absDc) && isClearPath(b, fromR, fromC, toR, toC);
      case 'k': return absDr <= 1 && absDc <= 1;
    }
    return false;
  }

  function findKing(b, cSt, color) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        if (b[r][c] === 'k' && cSt[r][c] === color) return { r, c };
      }
    }
    return null;
  }

  function isSquareAttacked(b, cSt, targetR, targetC, attackerColor) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        if (cSt[r][c] === attackerColor && isValidBasicMove(b, cSt, r, c, targetR, targetC)) {
          return true;
        }
      }
    }
    return false;
  }

  function isKingInCheck(b, cSt, color) {
    const kPos = findKing(b, cSt, color);
    if (!kPos) return false;
    const enemyColor = color === 'white' ? 'black' : 'white';
    return isSquareAttacked(b, cSt, kPos.r, kPos.c, enemyColor);
  }

  function isLegalMove(b, cSt, fromR, fromC, toR, toC) {
    if (!isValidBasicMove(b, cSt, fromR, fromC, toR, toC)) return false;
    const color = cSt[fromR][fromC];
    const tempB = b.map(row => [...row]);
    const tempC = cSt.map(row => [...row]);
    tempB[toR][toC] = tempB[fromR][fromC];
    tempB[fromR][fromC] = '';
    tempC[toR][toC] = tempC[fromR][fromC];
    tempC[fromR][fromC] = '';
    return !isKingInCheck(tempB, tempC, color);
  }

  function hasAnyLegalMoves(b, cSt, color) {
    for (let r1 = 0; r1 < 8; r1++) {
      for (let c1 = 0; c1 < 8; c1++) {
        if (cSt[r1][c1] === color) {
          for (let r2 = 0; r2 < 8; r2++) {
            for (let c2 = 0; c2 < 8; c2++) {
              if (isLegalMove(b, cSt, r1, c1, r2, c2)) return true;
            }
          }
        }
      }
    }
    return false;
  }

  // --- AI Opponent Logic ---
  const pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };

  function makeAIMove() {
    if (gameOver || turn !== aiColor) return;

    let possibleMoves = [];

    for (let r1 = 0; r1 < 8; r1++) {
      for (let c1 = 0; c1 < 8; c1++) {
        if (colorState[r1][c1] === aiColor) {
          for (let r2 = 0; r2 < 8; r2++) {
            for (let c2 = 0; c2 < 8; c2++) {
              if (isLegalMove(boardState, colorState, r1, c1, r2, c2)) {
                let score = 0;
                const targetPiece = boardState[r2][c2];
                if (targetPiece) {
                  score += (pieceValues[targetPiece] || 0) * 10;
                }
                score += Math.random() * 5; // slight random variation
                possibleMoves.push({ fromR: r1, fromC: c1, toR: r2, toC: c2, score });
              }
            }
          }
        }
      }
    }

    if (possibleMoves.length === 0) return;

    possibleMoves.sort((a, b) => b.score - a.score);
    const chosenMove = possibleMoves[0];

    executeMove(chosenMove.fromR, chosenMove.fromC, chosenMove.toR, chosenMove.toC);
  }

  function executeMove(fromR, fromC, toR, toC) {
    let piece = boardState[fromR][fromC];
    let pieceColor = colorState[fromR][fromC];
    let targetPiece = boardState[toR][toC];
    const isCapture = Boolean(targetPiece);

    if (piece === 'p' && ((pieceColor === 'white' && toR === 0) || (pieceColor === 'black' && toR === 7))) {
      piece = 'q';
    }

    boardState[toR][toC] = piece;
    boardState[fromR][fromC] = '';
    colorState[toR][toC] = pieceColor;
    colorState[fromR][fromC] = '';

    const enemyColor = pieceColor === 'white' ? 'black' : 'white';
    const inCheck = isKingInCheck(boardState, colorState, enemyColor);
    const hasMoves = hasAnyLegalMoves(boardState, colorState, enemyColor);
    
    let isCheckmate = inCheck && !hasMoves;
    turn = enemyColor;

    selectedSquare = null;

    if (isCheckmate) {
      if (!isAIMode && conn) conn.send({ type: 'move', board: boardState, colors: colorState, turn, isCapture, isCheck: inCheck, isCheckmate, winner: pieceColor });
      handleGameOver(pieceColor, "CHECKMATE! ");
    } else if (inCheck) {
      playSound('check');
      if (!isAIMode && conn) conn.send({ type: 'move', board: boardState, colors: colorState, turn, isCapture, isCheck: inCheck, isCheckmate: false, winner: pieceColor });
      render3D();
      updateStatus("CHECK!");
    } else {
      playSound(isCapture ? 'capture' : 'move');
      if (!isAIMode && conn) conn.send({ type: 'move', board: boardState, colors: colorState, turn, isCapture, isCheck: false, isCheckmate: false, winner: pieceColor });
      render3D();
      updateStatus();
    }

    if (isAIMode && turn === aiColor && !gameOver) {
      setTimeout(makeAIMove, 600);
    }
  }

  function handleClick(r, c) {
    if ((!isAIMode && !conn) || turn !== myColor || gameOver) return;

    if (selectedSquare) {
      if (selectedSquare.r === r && selectedSquare.c === c) {
        selectedSquare = null;
      } else if (isLegalMove(boardState, colorState, selectedSquare.r, selectedSquare.c, r, c)) {
        executeMove(selectedSquare.r, selectedSquare.c, r, c);
        return;
      } else {
        selectedSquare = (colorState[r][c] === turn) ? { r, c } : null;
      }
    } else {
      if (colorState[r][c] === turn) {
        selectedSquare = { r, c };
      }
    }
    render3D();
  }

  // --- Realistic Procedural Wood Textures ---
  function generateWoodTexture(colorHex1, colorHex2, grainIntensity = 0.12) {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = colorHex1;
    ctx.fillRect(0, 0, 512, 512);

    ctx.fillStyle = colorHex2;
    ctx.globalAlpha = grainIntensity;

    for (let i = 0; i < 600; i++) {
      const y = Math.random() * 512;
      const h = Math.random() * 3 + 1;
      ctx.fillRect(0, y, 512, h);
    }

    ctx.globalAlpha = grainIntensity * 0.5;
    for (let i = 0; i < 40; i++) {
      const cx = Math.random() * 512;
      const cy = Math.random() * 512;
      const rx = Math.random() * 200 + 50;
      const ry = Math.random() * 10 + 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    return texture;
  }

  const lightWoodTex = generateWoodTexture('#e2d0b5', '#b89968');
  const darkWoodTex = generateWoodTexture('#4a2f1c', '#261509');
  const borderWoodTex = generateWoodTexture('#24140b', '#110904');
  const pieceWhiteTex = generateWoodTexture('#e6cca0', '#c2a678');
  const pieceBlackTex = generateWoodTexture('#5c3b1e', '#2f1806');
  
  // Darker Oak Table Texture
  const oakTableTex = generateWoodTexture('#8c5a2b', '#4a280d', 0.22);

  // --- Three.js Setup & Realistic Materials ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x334155);

  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(450, 450);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  // Advanced Realistic Studio Lighting
  const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.85);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0xfff8ee, 1.2);
  keyLight.position.set(4, 12, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.bias = -0.0001;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 25;
  keyLight.shadow.camera.left = -10;
  keyLight.shadow.camera.right = 10;
  keyLight.shadow.camera.top = 10;
  keyLight.shadow.camera.bottom = -10;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x90b0ff, 0.5);
  fillLight.position.set(-6, 6, -4);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xffeedd, 0.6, 20);
  rimLight.position.set(0, 5, -6);
  scene.add(rimLight);

  // Materials with PBR (Physical Based Rendering)
  const lightSquareMat = new THREE.MeshPhysicalMaterial({ map: lightWoodTex, roughness: 0.25, clearcoat: 0.3, clearcoatRoughness: 0.2 });
  const darkSquareMat = new THREE.MeshPhysicalMaterial({ map: darkWoodTex, roughness: 0.3, clearcoat: 0.3, clearcoatRoughness: 0.2 });
  const selectedSquareMat = new THREE.MeshStandardMaterial({ color: 0xc8d645, roughness: 0.3, metalness: 0.1 });
  const checkSquareMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.1 });
  const borderMat = new THREE.MeshPhysicalMaterial({ map: borderWoodTex, roughness: 0.4, clearcoat: 0.2 });
  
  // Darker Oak Table Material
  const oakTableMat = new THREE.MeshPhysicalMaterial({ 
    map: oakTableTex, 
    roughness: 0.35, 
    clearcoat: 0.35, 
    clearcoatRoughness: 0.25 
  });

  // Tan/Boxwood Light Piece Material
  const whitePieceMat = new THREE.MeshPhysicalMaterial({
    map: pieceWhiteTex,
    color: 0xd2b48c,
    roughness: 0.25,
    metalness: 0.05,
    clearcoat: 0.4,
    clearcoatRoughness: 0.1
  });

  // Dark Walnut Piece Material
  const blackPieceMat = new THREE.MeshPhysicalMaterial({
    map: pieceBlackTex,
    color: 0x6e3f21,
    roughness: 0.35,
    metalness: 0.05,
    clearcoat: 0.2,
    clearcoatRoughness: 0.3
  });

  const moveHintMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.8 });
  const captureHintMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.85 });

  // Board Dimensions
  const squareSize = 0.82;
  const boardPadding = 0.35;
  const boardTotalSize = 8 * squareSize + boardPadding * 2;
  const boardCenter = (7 * squareSize) / 2;

  // Build Darker Oak Table Surface & Legs
  const tableTopGeo = new THREE.BoxGeometry(16, 0.4, 16);
  const tableTopMesh = new THREE.Mesh(tableTopGeo, oakTableMat);
  tableTopMesh.position.set(boardCenter, -0.56, boardCenter);
  tableTopMesh.receiveShadow = true;
  scene.add(tableTopMesh);

  const legGeo = new THREE.CylinderGeometry(0.35, 0.25, 6, 16);
  const legPositions = [
    [boardCenter - 7, -3.76, boardCenter - 7],
    [boardCenter + 7, -3.76, boardCenter - 7],
    [boardCenter - 7, -3.76, boardCenter + 7],
    [boardCenter + 7, -3.76, boardCenter + 7]
  ];

  legPositions.forEach(pos => {
    const legMesh = new THREE.Mesh(legGeo, oakTableMat);
    legMesh.position.set(...pos);
    legMesh.castShadow = true;
    legMesh.receiveShadow = true;
    scene.add(legMesh);
  });

  // Chess Board Base Frame
  const boardBaseGeo = new THREE.BoxGeometry(boardTotalSize, 0.35, boardTotalSize);
  const boardBaseMesh = new THREE.Mesh(boardBaseGeo, borderMat);
  boardBaseMesh.position.set(boardCenter, -0.185, boardCenter);
  boardBaseMesh.castShadow = true;
  boardBaseMesh.receiveShadow = true;
  scene.add(boardBaseMesh);

  // Helper to create smooth lathes
  function createLatheBody(pointsData, segments = 64) {
    const points = pointsData.map(p => new THREE.Vector2(p[0], p[1]));
    const geo = new THREE.LatheGeometry(points, segments);
    return new THREE.Mesh(geo);
  }

  // --- DISTINCT HIGH-DETAIL STAUNTON CHESS PIECES ---
  function createPieceGeometry(type) {
    const group = new THREE.Group();

    // Standardized wide, stable base with distinct decorative rings
    const standardBase = [
      [0, 0],
      [0.32, 0],
      [0.32, 0.04],
      [0.30, 0.07],
      [0.26, 0.10],
      [0.28, 0.12],
      [0.22, 0.16]
    ];

    if (type === 'p') {
      const pawnPoints = [
        ...standardBase,
        [0.14, 0.30],
        [0.12, 0.42],
        [0.18, 0.46],
        [0.12, 0.49]
      ];
      group.add(createLatheBody(pawnPoints));

      const headGeo = new THREE.SphereGeometry(0.14, 32, 32);
      const head = new THREE.Mesh(headGeo);
      head.position.y = 0.60;
      group.add(head);

    } else if (type === 'r') {
      const rookPoints = [
        ...standardBase,
        [0.20, 0.28],
        [0.21, 0.48],
        [0.26, 0.52],
        [0.25, 0.68]
      ];
      group.add(createLatheBody(rookPoints));

      const floorGeo = new THREE.CylinderGeometry(0.20, 0.20, 0.02, 32);
      const floorMesh = new THREE.Mesh(floorGeo);
      floorMesh.position.y = 0.54;
      group.add(floorMesh);

      for (let i = 0; i < 4; i++) {
        const crenelGeo = new THREE.BoxGeometry(0.08, 0.08, 0.12);
        const crenel = new THREE.Mesh(crenelGeo);
        const angle = (i * Math.PI) / 2;
        crenel.position.set(Math.cos(angle) * 0.21, 0.65, Math.sin(angle) * 0.21);
        crenel.rotation.y = angle;
        group.add(crenel);
      }

    } else if (type === 'n') {
      const knightBasePoints = [
        ...standardBase,
        [0.20, 0.22],
        [0.23, 0.28]
      ];
      group.add(createLatheBody(knightBasePoints));

      const knightGroup = new THREE.Group();

      const neckGeo = new THREE.CylinderGeometry(0.15, 0.22, 0.28, 16);
      const neck = new THREE.Mesh(neckGeo);
      neck.position.set(0, 0.38, -0.02);
      neck.rotation.x = -0.2;

      const headGeo = new THREE.BoxGeometry(0.16, 0.20, 0.32);
      const head = new THREE.Mesh(headGeo);
      head.position.set(0, 0.54, 0.08);
      head.rotation.x = 0.4;

      const snoutGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.18, 16);
      const snout = new THREE.Mesh(snoutGeo);
      snout.position.set(0, 0.48, 0.22);
      snout.rotation.x = 0.85;

      const earGeo = new THREE.ConeGeometry(0.035, 0.12, 8);
      const earL = new THREE.Mesh(earGeo);
      earL.position.set(-0.06, 0.68, -0.02);
      earL.rotation.x = -0.3;
      const earR = earL.clone();
      earR.position.x = 0.06;

      const maneGeo = new THREE.BoxGeometry(0.06, 0.32, 0.12);
      const mane = new THREE.Mesh(maneGeo);
      mane.position.set(0, 0.52, -0.10);
      mane.rotation.x = -0.3;

      knightGroup.add(neck, head, snout, earL, earR, mane);
      group.add(knightGroup);

    } else if (type === 'b') {
      // BISHOP: Pointed Mitre profile with a large, highly visible cross top
      const bishopPoints = [
        ...standardBase,
        [0.14, 0.28],
        [0.12, 0.44],
        [0.21, 0.52], // Flared collar ring
        [0.17, 0.60], // Lower mitre base
        [0.12, 0.74], // Tapered teardrop tip
        [0.05, 0.82]
      ];
      group.add(createLatheBody(bishopPoints));

      const mitreGroup = new THREE.Group();
      
      // Pointed tip dome topper
      const capTipGeo = new THREE.ConeGeometry(0.12, 0.20, 32);
      const capTip = new THREE.Mesh(capTipGeo);
      capTip.position.y = 0.76;
      mitreGroup.add(capTip);

      // Distinct, prominent Cross on top of the bishop
      const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.16, 0.045));
      crossV.position.y = 0.94;

      const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.045, 0.045));
      crossH.position.y = 0.96;

      mitreGroup.add(crossV, crossH);

      group.add(mitreGroup);

    } else if (type === 'q') {
      const queenPoints = [
        ...standardBase,
        [0.17, 0.32],
        [0.14, 0.64],
        [0.22, 0.76],
      ];
      group.add(createLatheBody(queenPoints));

      const crownGroup = new THREE.Group();
      crownGroup.position.y = 0.76;

      const outerR = 0.28;
      const innerR = 0.18;
      const crownHeight = 0.16;
      
      const pts = [];
      const numSpikes = 8;
      const angleStep = (Math.PI * 2) / (numSpikes * 2);

      for (let i = 0; i < numSpikes * 2; i++) {
        const r = (i % 2 === 0) ? outerR : innerR;
        const angle = i * angleStep;
        pts.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
      }
      
      const crownShape = new THREE.Shape(pts);
      
      const extrudeSettings = {
        depth: crownHeight,
        bevelEnabled: true,
        bevelThickness: 0.01,
        bevelSize: 0.01,
        bevelSegments: 8
      };
      
      const crownGeo = new THREE.ExtrudeGeometry(crownShape, extrudeSettings);
      const crownMesh = new THREE.Mesh(crownGeo);
      crownMesh.rotation.x = -Math.PI / 2;
      crownMesh.position.y = crownHeight / 2;
      
      for (let i = 0; i < numSpikes; i++) {
        const pt = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12));
        const angle = (i * 2) * angleStep;
        pt.position.set(Math.cos(angle) * outerR, crownHeight + 0.02, Math.sin(angle) * outerR);
        crownGroup.add(pt);
      }

      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16));
      orb.position.y = crownHeight / 2;
      
      crownGroup.add(crownMesh, orb);
      group.add(crownGroup);

    } else if (type === 'k') {
      const kingPoints = [
        ...standardBase,
        [0.18, 0.34],
        [0.15, 0.68],
        [0.25, 0.78],
        [0.16, 0.83]
      ];
      group.add(createLatheBody(kingPoints));

      const capGroup = new THREE.Group();

      const capGeo = new THREE.CylinderGeometry(0.24, 0.18, 0.22, 32);
      const cap = new THREE.Mesh(capGeo);
      cap.position.y = 0.92;
      capGroup.add(cap);

      const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.06));
      crossV.position.y = 1.11;

      const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.06));
      crossH.position.y = 1.14;

      capGroup.add(crossV, crossH);
      group.add(capGroup);
    }

    group.traverse(child => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    return group;
  }

  function updateCameraAngle() {
    if (myColor === 'black') {
      camera.position.set(boardCenter, 11.0, boardCenter - 5.2);
      camera.lookAt(boardCenter, 0, boardCenter);
    } else {
      camera.position.set(boardCenter, 11.0, boardCenter + 5.2);
      camera.lookAt(boardCenter, 0, boardCenter);
    }
  }
  updateCameraAngle();

  const dynamicGroup = new THREE.Group();
  scene.add(dynamicGroup);

  const squareGeo = new THREE.BoxGeometry(squareSize * 0.98, 0.08, squareSize * 0.98);
  const hintGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.04, 16);

  function render3D() {
    while (dynamicGroup.children.length > 0) {
      dynamicGroup.remove(dynamicGroup.children[0]);
    }

    let validMoves = [];
    if (selectedSquare && !gameOver) {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (isLegalMove(boardState, colorState, selectedSquare.r, selectedSquare.c, r, c)) {
            validMoves.push({ r, c });
          }
        }
      }
    }

    const currentKingInCheck = isKingInCheck(boardState, colorState, turn) ? findKing(boardState, colorState, turn) : null;

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        let mat = (r + c) % 2 === 1 ? darkSquareMat : lightSquareMat;
        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) mat = selectedSquareMat;
        if (currentKingInCheck && currentKingInCheck.r === r && currentKingInCheck.c === c) mat = checkSquareMat;

        const posX = c * squareSize;
        const posZ = r * squareSize;

        const sqMesh = new THREE.Mesh(squareGeo, mat);
        sqMesh.position.set(posX, -0.04, posZ);
        sqMesh.receiveShadow = true;
        sqMesh.userData = { r, c, type: 'square' };
        dynamicGroup.add(sqMesh);

        const isTarget = validMoves.some(m => m.r === r && m.c === c);
        if (isTarget) {
          const hintMat = colorState[r][c] ? captureHintMat : moveHintMat;
          const hintMesh = new THREE.Mesh(hintGeo, hintMat);
          const elevation = 0.04;
          hintMesh.position.set(posX, elevation, posZ);
          dynamicGroup.add(hintMesh);
        }

        const pType = boardState[r][c];
        const pColor = colorState[r][c];
        if (pType && pColor) {
          const pGroup = createPieceGeometry(pType);
          pGroup.position.set(posX, 0, posZ);
          
          const matToApply = pColor === 'white' ? whitePieceMat : blackPieceMat;
          pGroup.traverse(child => {
            if (child.isMesh) child.material = matToApply;
          });

          if (pType === 'n') {
            pGroup.rotation.y = pColor === 'white' ? 0 : Math.PI;
          }

          pGroup.userData = { r, c, type: 'piece' };
          dynamicGroup.add(pGroup);
        }
      }
    }
  }

  // --- Raycasting for 3D Clicks ---
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  container.addEventListener('click', (event) => {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(dynamicGroup.children, true);

    if (intersects.length > 0) {
      let topObj = intersects[0].object;
      while (topObj.parent && topObj.parent !== dynamicGroup) {
        topObj = topObj.parent;
      }
      if (topObj.userData && topObj.userData.r !== undefined) {
        handleClick(topObj.userData.r, topObj.userData.c);
      }
    }
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  // Start in AI Mode by default
  startAIMode();
  requestAnimationFrame(animate);
</script>

</body>
</html>
