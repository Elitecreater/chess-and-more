<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Gaming Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #050510;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .nebula {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.25), rgba(15, 23, 42, 0.8));
      z-index: 1;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #00f0ff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 230px 190px, #7000ff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      opacity: 0.6;
    }

    .container {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(112, 0, 255, 0.4);
      box-shadow: 0 0 30px rgba(112, 0, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      max-width: 450px;
      width: 90%;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .password-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 1rem;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 45px 12px 16px;
      border-radius: 6px;
      border: 1px solid #7000ff;
      background: rgba(5, 5, 16, 0.8);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .toggle-pw:hover {
      opacity: 1;
    }

    .btn {
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 0.75rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7000ff, #00f0ff);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .error-msg {
      color: #ff4a4a;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="nebula"></div>

  <!-- Password Screen -->
  <div id="gate-screen" class="container">
    <h1>Access Portal</h1>
    
    <div class="password-wrapper">
      <input type="password" id="password-input" placeholder="Enter Access Code">
      <button type="button" id="toggle-pw-btn" class="toggle-pw" aria-label="Toggle password visibility">👁️</button>
    </div>

    <div id="error-message" class="error-msg hidden">Incorrect Code. Try again.</div>
    <button class="btn btn-primary" id="login-btn">Enter System</button>
  </div>

  <!-- Main Screen (Revealed After Password) -->
  <div id="home-screen" class="container hidden">
    <h1>Welcome to players of all ELO's</h1>
    <button class="btn btn-primary" id="chess-btn">Chess</button>
    <button class="btn btn-secondary" id="checkers-btn">Checkers</button>
  </div>

  <script>
    const ACCESS_CODE = "space123";

    const gateScreen = document.getElementById("gate-screen");
    const homeScreen = document.getElementById("home-screen");
    const passwordInput = document.getElementById("password-input");
    const togglePwBtn = document.getElementById("toggle-pw-btn");
    const errorMessage = document.getElementById("error-message");
    const loginBtn = document.getElementById("login-btn");
    const chessBtn = document.getElementById("chess-btn");
    const checkersBtn = document.getElementById("checkers-btn");

    function unlockSite() {
      if (passwordInput.value === ACCESS_CODE) {
        gateScreen.classList.add("hidden");
        homeScreen.classList.remove("hidden");
      } else {
        errorMessage.classList.remove("hidden");
      }
    }

    togglePwBtn.addEventListener("click", function() {
      const isPassword = passwordInput.getAttribute("type") === "password";
      passwordInput.setAttribute("type", isPassword ? "text" : "password");
      togglePwBtn.textContent = isPassword ? "🙈" : "👁️";
    });

    loginBtn.addEventListener("click", unlockSite);

    passwordInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        unlockSite();
      }
    });

    chessBtn.addEventListener("click", function() {
      alert("Launching Chess...");
    });

    checkersBtn.addEventListener("click", function() {
      alert("Launching Checkers...");
    });
  </script>
</body>
</html>
