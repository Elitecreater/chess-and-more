<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Gaming Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stars"></div>
  <div class="nebula"></div>

  <!-- Password Screen -->
  <div id="gate-screen" class="container">
    <h1>Access Portal</h1>
    
    <div class="password-wrapper">
      <input type="password" id="password-input" placeholder="Enter Access Code">
      <button type="button" id="toggle-pw-btn" class="toggle-pw" aria-label="Toggle password visibility">👁️</button>
    </div>

    <div id="error-message" class="error-msg hidden">Incorrect Code. Try again.</div>
    <button class="btn" id="login-btn">Enter System</button>
  </div>

  <!-- Main Screen (Revealed After Password) -->
  <div id="home-screen" class="container hidden">
    <h1>Welcome to players of all ELO's</h1>
    <div class="button-grid">
      <button class="btn" id="chess-btn">Chess</button>
      <button class="btn" id="chess-3d-btn">Chess 3D</button>
      <button class="btn" id="checkers-btn">Checkers</button>
      <button class="btn" id="ludo-btn">Ludo</button>
      <button class="btn" id="catan-btn">Catan</button>
      <button class="btn" id="tcgcp-btn">Taco Cat Goat Cheese Pizza</button>
    </div>
  </div>

  <!-- Game Screen (Where your game code will run) -->
  <div id="game-screen" class="container hidden" style="max-width: 800px;">
    <button class="btn" id="back-btn" style="margin-bottom: 1rem;">← Back to Menu</button>
    <div id="game-code-area"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
